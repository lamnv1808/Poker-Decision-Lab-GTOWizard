services:
  - type: web
    name: poker-decision-lab
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poker-decision-lab-db
          property: connectionString
databases:
  - name: poker-decision-lab-db
    plan: basic-256mb
