# Render Blueprint — REFERENCE ONLY. Production is NOT Blueprint-managed (no Blueprint exists in the
# workspace; the service and database were created in the dashboard). Do not create a Blueprint from this
# file without reviewing it first: a Blueprint applies this file to real resources.
#
# Safety properties (2026-11-04):
#   - no `databases:` block → a Blueprint can never create a (paid) database or relink DATABASE_URL;
#   - DATABASE_URL and APP_SECRET are `sync: false` → a Blueprint asks for them once and never
#     overwrites an existing value (generateValue would rotate APP_SECRET and log every user out);
#   - plan/region/branch mirror the live service (free, singapore, main).
services:
  - type: web
    name: Poker-Decision-Lab-GTOWizard
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OWNER_EMAILS
        sync: false
